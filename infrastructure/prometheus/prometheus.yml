# Prometheus - metrics collection (ARCHITECTURE.md)
# Metrics: transfer success rate, latency per step, compensation rate,
# circuit breaker states, Kafka message throughput.
# Spring Boot services must expose /actuator/prometheus (management.endpoints.web.exposure.include=prometheus).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # SAGA microservices (run on host machine; use host.docker.internal from Docker)
  - job_name: saga-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8083]
  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8084]
  - job_name: validation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8085]
  - job_name: currency-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8086]
  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8087]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8088]
  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8089]
